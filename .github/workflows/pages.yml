# Build the static site and publish it to GitHub Pages on every push to
# main that changes the app (or by hand from the Actions tab). This is the
# only workflow in the repo: it deploys, it doesn't gate anything — run
# `npm test` locally.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Docs and editor settings aren't part of the site.
    paths-ignore: ["docs/**", "**.md", ".vscode/**", ".claude/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A newer push waits for the running one instead of
# cancelling it: a deployment cancelled half-way can leave Pages stuck.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.first.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      # Publishing normally takes seconds. When GitHub Pages stalls ("syncing
      # files"), give up after 2 minutes instead of the default 10 and try once
      # more, rather than leaving the run hanging.
      - id: first
        uses: actions/deploy-pages@v5
        continue-on-error: true
        with:
          timeout: 120000
      - id: retry
        if: steps.first.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          timeout: 180000
