<app-step-indicator [current]="step()" [toolRoute]="tool().route" />

<header class="tool-header">
  <div class="tool-title-row">
    <span class="tool-icon" [class.batch]="tool().batch" [class.single]="!tool().batch">
      <app-icon [name]="tool().id" [size]="22" />
    </span>
    <h1>{{ tool().title }}</h1>
    <span class="tool-badge" [class.batch]="tool().batch" [class.single]="!tool().batch">
      {{ tool().batch ? 'Batch' : 'Single' }}
    </span>
  </div>
  <p>{{ tool().description }}</p>
</header>
