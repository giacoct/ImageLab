<app-tool-header [tool]="tool()" step="settings" />

<div class="tool-workspace">
  <div class="input-column">
    <ng-content select="[preview]" />

    @if (files().length > 0) {
      <section class="file-panel panel" aria-label="Selected files">
        <h2>{{ files().length }} {{ files().length === 1 ? 'image' : 'images' }}</h2>
        <app-file-list
          [files]="files()"
          [selectable]="selectable()"
          [selectedIndex]="selectedIndex()"
          (fileSelected)="fileSelected.emit($event)"
        />
      </section>
    }
  </div>

  <section class="settings panel">
    <h2>Settings</h2>

    <ng-content />

    @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
    }

    <div class="action-row">
      <a class="button secondary" [routerLink]="tool().route + '/import'">
        <app-icon name="arrow-left" [size]="18" />
        Back
      </a>
      <button class="button" type="button" [disabled]="!canSubmit()" (click)="action.emit()">
        <app-icon name="sparkles" [size]="18" />
        {{ actionLabel() }}
      </button>
    </div>
  </section>
</div>
