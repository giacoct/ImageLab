<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Personal image tools that run entirely in your browser." />
    <meta name="theme-color" content="#f4f7f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1d1e23" media="(prefers-color-scheme: dark)" />
    <title>ImageLab</title>
    <link rel="icon" href="favicon.ico" />
    <link rel="manifest" href="manifest.webmanifest" />
    <script>
      // Apply the saved theme before the first paint (see src/app/theme.svelte.ts).
      try {
        const theme = JSON.parse(localStorage.getItem('imagelab:theme'));
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch {
        // Storage unavailable: follow the system theme.
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
